slam_toolbox_node:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topc: /scan
    mode: mapping

    minimum_time_interval: 0.1
    transform_publish_period: 0.05
    map_dat_interval: 2.0

    maxlaser_range: 12.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    resolution: 0.05