ekf_filter_node:
  ros__parameters:
    frequency: 30.0   
    two_d_mode: true
    publish_tf: true
    
    transform_time_offset: 0.1 
    transform_timeout: 0.2

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- SOURCE 1 : ROUES (VITESSE LINÉAIRE UNIQUEMENT) ---
    odom0: /wheel/odom
    
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # Seul VX (index 6) est à true. VYAW (index 11) est FALSE.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,  
                   false, false, false,  
                   false, false, false]
    
    odom0_differential: false
    odom0_queue_size: 10

    # --- SOURCE 2 : IMU (ROTATION PURE) ---
    imu0: /imu_data 
    
    # YAW (Index 5) et VYAW (Index 11) sont à true. AX est bien resté à false.
    imu0_config: [false, false, false,
                  false, false, true,  
                  false, false, false,
                  false, false, true,  
                  false, false, false] 
                  
    imu0_differential: false
    imu0_relative: true  
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
