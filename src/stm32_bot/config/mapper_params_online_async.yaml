slam_toolbox:
  ros__parameters:
    # Paramètres de base (Tes frames)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_deskewed
    
    # Mode cartographie en direct
    mode: mapping
    
    # Paramètres d'optimisation (Adaptés pour un Lidar à 10Hz)
    map_update_interval: 0.5             # <-- Modifié ici (0.5s au lieu de 1.0s)
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 5.0
    stack_size_to_use: 40000000
    
    # --- NOUVEAUX PARAMÈTRES POUR FORCER LA MISE À JOUR RAPIDE ---
    minimum_travel_distance: 0.1         # Le SLAM calcule un nouveau point tous les 10 cm
    minimum_travel_heading: 0.17         # Le SLAM calcule un nouveau point tous les ~10 degrés
    
    # On désactive la cartographie 3D (inutile pour toi)
    enable_interactive_mode: true
    use_sim_time: false
