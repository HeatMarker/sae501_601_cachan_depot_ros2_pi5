slam_toolbox:
  ros__parameters:
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan_deskewed
    mode:        localization

    # Carte à charger (sans extension — charge .posegraph + .data)
    map_file_name: /home/spinetti/ros2_ws/src/stm32_bot/maps/maps
    map_start_at_dock: false

    # Timing
    minimum_time_interval:   0.1
    transform_publish_period: 0.04   # 25 Hz
    tf_buffer_duration:      5.0
    transform_timeout:       0.3

    # Fréquence de mise à jour (en localisation, pas besoin d'updater la carte souvent)
    map_update_interval: 60.0
    resolution:          0.05
    max_laser_range:     12.0

    # Seuils de déclenchement d'une mise à jour de pose
    minimum_travel_distance: 0.05   # 5 cm — mise à jour très fréquente
    minimum_travel_heading:  0.05   # ~3°

    # Scan matching — paramètres pour lidar 10 Hz basse résolution
    scan_buffer_size:                       10
    scan_buffer_maximum_scan_distance:      10.0
    link_match_minimum_response_fine:       0.4
    link_scan_maximum_distance:             2.0

    # Loop closure désactivée en localisation
    do_loop_closing: false

    # Paramètres de corrélation
    correlation_search_space_dimension:    0.5
    correlation_search_space_resolution:   0.01
    correlation_search_space_smear_deviation: 0.1

    distance_variance_penalty: 0.3
    angle_variance_penalty:    0.8
    fine_search_angle_offset:  0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution:   0.0349
    minimum_angle_penalty:     0.9
    minimum_distance_penalty:  0.5
    use_response_expansion:    true

    use_scan_matching:     true
    use_scan_barycenter:   true
    stack_size_to_use:     40000000
    enable_interactive_mode: false
    use_sim_time:          false
