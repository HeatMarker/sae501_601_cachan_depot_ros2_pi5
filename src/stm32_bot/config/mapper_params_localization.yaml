slam_toolbox:
  ros__parameters:
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan_deskewed
    mode:        localization

    # Carte à charger (sans extension — charge .posegraph + .data)
    map_file_name: /home/spinetti/ros2_ws/src/stm32_bot/maps/maps
    map_start_at_dock: false

    # Timing
    minimum_time_interval:    0.05   # traiter jusqu'à 20 scans/s (LiDAR 10Hz → chaque scan)
    transform_publish_period: 0.02   # 50 Hz — TF fluide pour Pure Pursuit rapide
    tf_buffer_duration:       5.0
    transform_timeout:        0.3

    # CRITIQUE : ne JAMAIS re-publier /map pendant la course
    # → évite l'écrasement du map_server + pas de mise à jour de carte
    map_update_interval: 9999.0
    resolution:          0.05
    max_laser_range:     12.0

    # Seuils de déclenchement — très fréquent pour corriger tôt la dérive
    minimum_travel_distance: 0.02   # correction tous les 2 cm
    minimum_travel_heading:  0.02   # correction tous les ~1°

    # Scan matching — zone de recherche élargie pour rattraper la dérive odométrie
    scan_buffer_size:                       15
    scan_buffer_maximum_scan_distance:      10.0
    link_match_minimum_response_fine:       0.3    # moins strict → moins de "pas de match"
    link_scan_maximum_distance:             3.0    # cherche plus loin dans le graphe

    # Loop closure désactivée en localisation
    do_loop_closing: false

    # Corrélation — espace de recherche élargi (rattrape jusqu'à ~40cm de dérive)
    correlation_search_space_dimension:    0.8    # était 0.5
    correlation_search_space_resolution:   0.01
    correlation_search_space_smear_deviation: 0.1

    distance_variance_penalty: 0.3
    angle_variance_penalty:    0.8
    fine_search_angle_offset:  0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution:   0.0349
    minimum_angle_penalty:     0.9
    minimum_distance_penalty:  0.5
    use_response_expansion:    true

    use_scan_matching:     true
    use_scan_barycenter:   true
    stack_size_to_use:     40000000
    enable_interactive_mode: false
    use_sim_time:          false
